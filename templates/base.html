<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block heading %}Min webbplats{% endblock %}</title>
</head>

<body>
    <style>
    body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    }
    main {
    flex: 1;
    }
    header {
        background-color: #3498db;
        color: white;
        padding: 20px;
        text-align: center;
    } nav {
        background-color: #34495e;
        padding: 15px;
        text-align: center;
    } nav a {
        color: white;
        text-decoration: none;
        margin: 0 10px;
    } nav a:hover {
        text-decoration: underline;
    }
    footer {
    background-color: #2c3e50;
    color: white;
    padding: 20px;
    text-align: center;
    }
    </style>
    <nav>
        <a href="/">Hem</a> |
        <a href="/about">Om oss</a> |
        <a href="/contact">Kontakt</a>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Min webbplats</p>
    </footer>

</body>
</html>
